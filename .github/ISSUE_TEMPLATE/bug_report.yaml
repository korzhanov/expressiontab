name: "🐛 Bug report"
description: Report an issue with ExpressionTab
body:
  - type: markdown
    attributes:
      value: |
        First thing first, thanks for reporting!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us in the description. Thanks!
      placeholder: Bug description
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: New-tab UI screenshots that prove the point.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Chrome version, OS, steps (Load unpacked → new tab → …).
      placeholder: Reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console around the time this bug occurred (paste text, not a screenshot if possible).
      render: "shell-script"
  - type: checkboxes
    id: searched
    attributes:
      label: Have you checked if this issue has already been raised?
      options:
        - label: I did not find any similar issues
          required: true
